# ============================================
# Nginx Security Configuration
# ملف تأمين Nginx الشامل
# ============================================
# ضع هذا الملف في: /etc/nginx/conf.d/security.conf

# ========== إخفاء معلومات السيرفر ==========
server_tokens off;
more_clear_headers Server;

# ========== Security Headers ==========
# حماية من XSS Attacks
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;

# Content Security Policy - حماية شاملة
add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

# Referrer Policy
add_header Referrer-Policy "no-referrer-when-downgrade" always;

# Permissions Policy (formerly Feature-Policy)
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# HSTS - إجبار HTTPS فقط (فعله بعد التأكد من شهادة SSL)
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

# ========== حماية من DDoS والطلبات المشبوهة ==========
# تحديد حجم الطلبات
client_body_buffer_size 1K;
client_header_buffer_size 1k;
client_max_body_size 100M;
large_client_header_buffers 2 1k;

# Timeouts لمنع الاتصالات البطيئة
client_body_timeout 10;
client_header_timeout 10;
keepalive_timeout 5 5;
send_timeout 10;

# ========== Rate Limiting ==========
# منطقة لتحديد معدل الطلبات
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# تحديد عدد الاتصالات المتزامنة
limit_conn addr 10;

# ========== منع الوصول للملفات الحساسة ==========
# منع الوصول لملفات النظام
location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}

# منع الوصول لملفات النسخ الاحتياطي
location ~ ~$ {
    deny all;
    access_log off;
    log_not_found off;
}

# منع الوصول لملفات الإعداد
location ~* \.(env|git|gitignore|htaccess|htpasswd|ini|log|sh|sql|conf|config)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# ========== حظر User Agents المشبوهة ==========
if ($http_user_agent ~* (360Spider|80legs|Aboundex|Abonti|Acunetix|masscan|nmap|nikto|sqlmap|dirbuster)) {
    return 403;
}

# ========== منع Hotlinking ==========
location ~ \.(gif|png|jpe?g|svg|webp)$ {
    valid_referers none blocked server_names *.yourdomain.com yourdomain.com;
    if ($invalid_referer) {
        return 403;
    }
}

# ========== تحسين الأداء مع الأمان ==========
# Gzip compression
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml text/javascript 
           application/json application/javascript application/xml+rss 
           application/rss+xml font/truetype font/opentype 
           application/vnd.ms-fontobject image/svg+xml;

# Browser caching
location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}
