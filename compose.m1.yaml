name: tabweb-m1-fresh

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run m1:env first}
      MYSQL_DATABASE: tabweb_m1_test
    ports:
      - "127.0.0.1:13316:3306"
    volumes:
      - m1_mysql_data:/var/lib/mysql
      - ./server/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 3s
      timeout: 3s
      retries: 40

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run npm run m1:env first}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run npm run m1:env first}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - m1_minio_data:/data

volumes:
  m1_mysql_data:
    name: tabweb_m1_fresh_mysql_data_20261009
  m1_minio_data:
    name: tabweb_m1_fresh_minio_data_20261009
