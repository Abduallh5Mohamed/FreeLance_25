# ═══════════════════════════════════════════════════════
# Al-Qaed Platform — Hardened Nginx Configuration v4.0
# Anti-piracy + Security + Performance
# ═══════════════════════════════════════════════════════

# Block bad bots and scanners
map $http_user_agent $bad_bot {
    default 0;
    ~*malicious 1;
    ~*scanner 1;
    ~*sqlmap 1;
    ~*nikto 1;
    ~*nmap 1;
    ~*masscan 1;
    ~*scrapy 1;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=video_limit:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=segment_limit:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
limit_conn_zone $binary_remote_addr zone=video_conn_limit:10m;

# Upstream definitions
upstream backend {
    server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

upstream minio {
    server 127.0.0.1:9000 max_fails=3 fail_timeout=30s;
    keepalive 64;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name elka2d.cloud www.elka2d.cloud 72.62.35.177;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://elka2d.cloud$request_uri;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name elka2d.cloud www.elka2d.cloud;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/elka2d.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/elka2d.cloud/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    root /var/www/alqaed/dist;
    index index.html;

    # ═══ STRICT SECURITY HEADERS ═══
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), display-capture=(), encrypted-media=(self \"https://player.vdocipher.com\")" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    # CSP: Block inline scripts from extensions, restrict media sources
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.youtube.com https://www.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://elka2d.cloud wss://elka2d.cloud; media-src 'self' blob:; frame-src https://www.youtube.com https://drive.google.com https://player.vdocipher.com; worker-src 'self' blob:;" always;

    # Block bad bots
    if ($bad_bot) {
        return 403;
    }

    # Block common attack patterns
    location ~* (\.(bak|backup|swp|old|orig|dist|save|sql|gz|tar|zip|rar|7z)|~$) {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        return 404;
    }

    location ~* (composer\.(json|lock)|package\.json|package-lock\.json|\.env|\.git|readme|license|changelog) {
        deny all;
        return 404;
    }

    # ═══ HLS PLAYLIST ACCESS (rate limited, no cache) ═══
    location ~* \.m3u8$ {
        # Rate limit segment access
        limit_req zone=segment_limit burst=10 nodelay;
        limit_conn video_conn_limit 5;

        # Proxy to MinIO
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://minio;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:9000;
        proxy_set_header Connection "";

        # NO caching of playlists
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # ═══ HLS SEGMENT ACCESS (rate limited, no cache) ═══
    location ~* \.ts$ {
        # Strict rate limiting for segments
        limit_req zone=segment_limit burst=20 nodelay;
        limit_conn video_conn_limit 8;

        # Prevent range abuse (only allow small ranges)
        # proxy_set_header Range "";

        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://minio;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:9000;
        proxy_set_header Connection "";

        # No caching
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Large file uploads
    client_max_body_size 5000M;
    client_body_timeout 3600s;
    client_header_timeout 60s;
    client_body_buffer_size 512k;
    proxy_buffers 16 32k;
    proxy_buffer_size 64k;

    # Connection limits
    limit_conn conn_limit 50;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ═══ MinIO Storage Proxy (non-video) ═══
    location /storage/ {
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://elka2d.cloud' always;
            add_header 'Access-Control-Allow-Methods' 'GET, PUT, POST, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-amz-content-sha256,x-amz-date,x-amz-acl' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://minio;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 3600;
        proxy_send_timeout 3600;
        proxy_read_timeout 3600;
        send_timeout 3600;
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 32 128k;
        proxy_busy_buffers_size 256k;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;

        add_header 'Access-Control-Allow-Origin' 'https://elka2d.cloud' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,ETag' always;
    }

    # ═══ SECURE VIDEO API (rate limited) ═══
    location /api/secure-video/ {
        limit_req zone=video_limit burst=10 nodelay;

        proxy_pass http://backend/api/secure-video/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30;
        proxy_send_timeout 30;
        proxy_read_timeout 30;

        # No caching for security endpoints
        add_header Cache-Control "no-cache, no-store" always;
    }

    # ═══ API Backend ═══
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
        client_max_body_size 5000M;
    }

    # ═══ Login strict rate limiting ═══
    location ~* ^/api/(auth|login|register) {
        limit_req zone=login_limit burst=5 nodelay;

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ═══ Socket.IO ═══
    location /socket.io/ {
        proxy_pass http://backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 86400;
        proxy_send_timeout 86400;
        proxy_read_timeout 86400;
    }

    # ═══ Uploaded Files ═══
    location /uploads/ {
        alias /root/uploads/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        location ~* \.(jpg|jpeg|png|gif|webp|pdf)$ {
            expires 7d;
            add_header Cache-Control 'public, immutable';
        }

        location ~* \.(php|php5|phtml|cgi|pl|py|sh|bash|exe|dll|asp|aspx|jsp)$ {
            deny all;
            return 404;
        }
    }

    # ═══ Frontend (SPA) ═══
    location / {
        try_files $uri $uri/ /index.html;

        # Service Worker
        location = /security-sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Service-Worker-Allowed "/" always;
        }

        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # Block WordPress exploits etc
    location ~* (wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|myadmin|pma|adminer) {
        deny all;
        return 404;
    }
}
