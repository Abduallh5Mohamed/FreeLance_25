# =====================================================
# NGINX Configuration for MinIO
# Add this to your nginx.conf or site configuration
# =====================================================

# MinIO API (for presigned URLs)
upstream minio {
    server 127.0.0.1:9000;
}

# MinIO Console (admin interface)
upstream minio_console {
    server 127.0.0.1:9001;
}

server {
    listen 80;
    server_name your-domain.com;

    # Your existing Node.js backend
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MinIO storage (for video streaming via presigned URLs)
    location /storage/ {
        proxy_pass http://minio/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Important for video streaming
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Increase timeouts for large video uploads
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
        
        # Allow large file uploads (5GB)
        client_max_body_size 5G;
    }

    # MinIO Console (optional - for admin access)
    location /minio-console/ {
        proxy_pass http://minio_console/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support for console
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Your frontend
    location / {
        root /var/www/your-frontend;
        try_files $uri $uri/ /index.html;
    }
}

